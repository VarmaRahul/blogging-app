name: CI/CD Pipeline - Build, Scan, & GitOps Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          ignore: DL3008,DL3018,DL3059

  gitleaks:
    name: Secrets Scan
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2

  sast-codeql:
    name: SAST (CodeQL)
    runs-on: self-hosted
    continue-on-error: true
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  dependency-scan:
    name: Dependency Scan
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit pip-licenses
      - run: pip-audit

  build-scan-push:
    name: Build, Scan & GitOps Deploy
    needs: [dockerfile-lint, gitleaks, sast-codeql, dependency-scan]
    runs-on: self-hosted
    permissions:
      contents: write # Required for git-auto-commit-action to push values.yaml changes back
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: xedose/blogging-app:v1.0.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        continue-on-error: true
        with:
          image-ref: xedose/blogging-app:v1.0.${{ github.run_number }}
          format: table
          severity: CRITICAL,HIGH

      - name: Update Helm values.yaml tag
        run: |
          python -c '
          import yaml
          path = "deploy/helm/blogging-app/values.yaml"
          with open(path, "r") as f:
              data = yaml.safe_load(f)
          
          if "image" in data:
              data["image"]["tag"] = "v1.0.${{ github.run_number }}"
          else:
              data["tag"] = "v1.0.${{ github.run_number }}"
              
          with open(path, "w") as f:
              yaml.dump(data, f)
          '

      - name: Commit and Push Updated Values to GitOps
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: deploy/helm/blogging-app/values.yaml
          commit_message: "chore(gitops): update image tag to v1.0.${{ github.run_number }} [skip ci]"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"