apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blogging-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VarmaRahul/blogging-app.git
    targetRevision: main
    path: deploy/helm/blogging-app                     
  destination:
    server: https://kubernetes.default.svc
    namespace: blogging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true