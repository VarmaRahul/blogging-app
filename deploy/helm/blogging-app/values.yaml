autoscaling:
  enabled: true
  maxReplicas: 5
  minReplicas: 2
  targetCPUUtilizationPercentage: 70
image:
  pullPolicy: IfNotPresent
  repository: xedose/blogging-app
  tag: v1.0.13
ingress:
  className: alb
  enabled: true
  host: blogging.example.com
replicaCount: 2
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
service:
  port: 8000
  targetPort: 8000
  type: ClusterIP
