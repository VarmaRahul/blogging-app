name: CI/CD Pipeline - Build, Scan, & GitOps Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'deployment/**'
  workflow_dispatch:

jobs:
  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          ignore: DL3008,DL3018,DL3059

  gitleaks:
    name: Secrets Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3

  sast-codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: github/codeql-action/init@v4
        with:
          languages: python

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pip-audit pip-licenses

      - run: pip-audit

  build-scan-push:
    name: Build, Scan & GitOps Deploy
    needs: [dockerfile-lint, gitleaks, sast-codeql, dependency-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for git-auto-commit-action to push values.yaml changes back
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: xedose/blogging-app:v1.0.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        continue-on-error: true
        with:
          image-ref: xedose/blogging-app:v1.0.${{ github.run_number }}
          format: table
          severity: CRITICAL,HIGH

      - name: Update Kubernetes web.yaml image tag
        run: |
          sed -i "s|image: xedose/blogging-app:.*|image: xedose/blogging-app:v1.0.${{ github.run_number }}|g" deployment/k8s/web.yaml

      - name: Commit and Push Updated Manifest to GitOps
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: deployment/k8s/web.yaml
          commit_message: "chore(gitops): update image tag to v1.0.${{ github.run_number }} [skip ci]"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"